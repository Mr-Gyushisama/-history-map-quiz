<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b6b4b" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>BALLNOTE v0.2.1 Interactive</title>
<style>
:root{
  --green:#0b6b4b;--green2:#14946b;--ink:#102030;--muted:#687887;--bg:#f3f7f5;--card:#fff;--line:#dfe8e4;
  --red:#d73737;--amber:#d5a000;--navy:#14344e;--blue:#2877d4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}.app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:88px}
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--navy),var(--green));color:#fff;padding:14px 16px 12px;box-shadow:0 2px 12px #0002}.brand{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand h1{font-size:20px;margin:0}.status{font-size:12px;border:1px solid #ffffff66;background:#ffffff18;padding:6px 10px;border-radius:999px}.content{padding:12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 5px 20px #1232}.big{font-size:30px;font-weight:900}.score{font-size:32px;font-weight:900;color:var(--green)}.muted{color:var(--muted);font-size:13px}.small{font-size:12px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.stack{display:grid;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px}.seg{display:grid;grid-template-columns:1fr 1fr;background:#edf2ef;border-radius:12px;padding:3px;gap:3px}.seg button{border:0;background:transparent;border-radius:9px;padding:10px;font-weight:800}.seg button.on{background:var(--green);color:#fff}.btn{border:0;border-radius:14px;padding:13px 14px;font-weight:850;background:#edf3f0;color:var(--ink)}.btn.primary{background:var(--green);color:#fff}.btn.outline{background:#fff;border:1.5px solid var(--green);color:var(--green)}.btn.danger{background:#fff;border:1.5px solid var(--red);color:var(--red)}.btn.blue{background:var(--blue);color:#fff}.btn:disabled{opacity:.35;cursor:default}.full{width:100%}
.lineup-row{display:grid;grid-template-columns:42px 1fr 72px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.order{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#edf2ef;font-weight:900}.pos{padding:7px 8px;border-radius:9px;background:#eaf7f0;color:#146948;text-align:center;font-weight:800}.bench{display:flex;gap:7px;overflow:auto}.pill{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 10px;font-size:13px}
.livehead{display:grid;grid-template-columns:1fr 1fr 120px;gap:10px;align-items:center}.counts{display:flex;justify-content:space-around;font-size:18px;font-weight:900}.dot{width:18px;height:18px;border-radius:50%;display:inline-block;background:#d9dfdd;margin-left:4px}.dot.on.b{background:#14a66f}.dot.on.s{background:#e2ae00}.dot.on.o{background:#dd3e3e}.pitch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.pitch-grid .btn{min-height:80px;font-size:17px}.pitch-grid .ball{background:#12a86f;color:#fff}.pitch-grid .strike{background:#d7a400;color:#fff}.pitch-grid .foul{background:#5c6978;color:#fff}.pitch-grid .wide{grid-column:span 2;background:var(--green);color:#fff}.diamond{position:relative;width:112px;height:112px;margin:auto}.base{position:absolute;width:26px;height:26px;border:2px solid #91a2ac;background:#fff;transform:rotate(45deg);border-radius:3px}.base.on{background:#f1c52a;border-color:#c89f0a}.b2{top:4px;left:43px}.b1{top:43px;right:4px}.b3{top:43px;left:4px}.homebase{left:43px;bottom:4px}.runner-name{font-size:10px;text-align:center;color:#635400}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick .btn{padding:11px 8px}.last{background:#edf9f3;border:1px solid #c8eadb;border-radius:12px;padding:10px}.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fffffff5;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.navinner{width:min(760px,100%);margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.navbtn{border:0;background:none;padding:9px 3px 8px;color:#667684;font-size:11px;font-weight:800}.navbtn.active{color:var(--green)}.navicon{display:block;font-size:21px;margin-bottom:2px}
.modalback{position:fixed;inset:0;z-index:60;background:#0008;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(760px,100%);max-height:86vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:16px;padding-bottom:max(18px,env(safe-area-inset-bottom))}.modal h2{margin:0 0 10px}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice-grid .btn{min-height:58px}.event{display:grid;grid-template-columns:60px 1fr auto;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}.badge{font-size:11px;background:#edf2ef;border-radius:999px;padding:4px 7px;height:max-content}.table-wrap{overflow:auto}.tbl{width:100%;min-width:610px;border-collapse:collapse}.tbl th,.tbl td{padding:8px 7px;border-bottom:1px solid var(--line);font-size:13px;text-align:center}.tbl th{background:#edf3f0;font-weight:900}.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:#fff}.tabs{display:flex;gap:6px;overflow:auto}.tab{white-space:nowrap;border:0;background:#edf2ef;border-radius:999px;padding:9px 12px;font-weight:800}.tab.active{background:var(--green);color:#fff}.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi>div{background:#edf3f0;border-radius:12px;padding:9px;text-align:center}.kpi strong{display:block;font-size:20px}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:80;background:#102030;color:#fff;border-radius:999px;padding:10px 16px;font-size:13px;box-shadow:0 5px 20px #0004}.warn{background:#fff3d5;border:1px solid #efd37d;color:#755500;border-radius:12px;padding:9px 10px;font-size:13px}
@media(max-width:560px){.content{padding:10px}.card{border-radius:15px;padding:12px}.livehead{grid-template-columns:1fr 1fr 105px}.big,.score{font-size:27px}.pitch-grid .btn{min-height:72px}.choice-grid{grid-template-columns:repeat(2,1fr)}.kpi{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app"><div class="app"><div class="topbar"><div class="brand"><h1>BALLNOTE <span class="small">v0.2.1</span></h1><span class="status">起動中</span></div></div><div class="content"><div class="card"><div class="big">BALLNOTE</div><p class="muted">アプリを起動しています。</p><div id="boot-status" class="warn">画面が切り替わらない場合は、この欄にエラー内容を表示します。</div></div></div></div></div>
<script>
(function(){
  function showBootError(message){
    var box=document.getElementById('boot-status');
    if(!box){box=document.createElement('div');document.body.prepend(box);}
    box.style.cssText='margin:16px;padding:14px;background:#fff3d5;border:1px solid #d99b00;color:#5b4300;border-radius:12px;font:14px -apple-system,BlinkMacSystemFont,sans-serif;white-space:pre-wrap';
    box.textContent='起動エラー: '+message;
  }
  window.__ballnoteBootError=showBootError;
  window.addEventListener('error',function(e){showBootError((e && e.message)||'不明なJavaScriptエラー');});
  window.addEventListener('unhandledrejection',function(e){showBootError('Promiseエラー: '+String(e && e.reason || '不明'));});
})();
</script>
<script>
const TEAM=[
{id:'p1',name:'選手01',pos:'SS'},{id:'p2',name:'選手02',pos:'2B'},{id:'p3',name:'選手03',pos:'LF'},
{id:'p4',name:'選手04',pos:'1B'},{id:'p5',name:'選手05',pos:'CF'},{id:'p6',name:'選手06',pos:'3B'},
{id:'p7',name:'選手07',pos:'RF'},{id:'p8',name:'選手08',pos:'C'},{id:'p9',name:'選手09',pos:'P'},
{id:'p10',name:'選手10',pos:'OF'},{id:'p11',name:'選手11',pos:'IF'},{id:'p12',name:'選手12',pos:'OF'}];
const $=s=>document.querySelector(s);const app=document.getElementById('app');
const clone=v=>JSON.parse(JSON.stringify(v));
const emptyStat=()=>({PA:0,AB:0,R:0,H:0,B2:0,B3:0,HR:0,RBI:0,BB:0,K:0});
const initialStats=()=>Object.fromEntries(TEAM.map(p=>[p.id,emptyStat()]));
const today=()=>{const d=new Date();const z=d.getTimezoneOffset()*60000;return new Date(d-z).toISOString().slice(0,10)};
const freshDraft=()=>({date:today(),opponent:'',side:'away'});
const freshGame=d=>({
 id:'g-'+Date.now(),date:d.date||today(),opponent:(d.opponent||'相手チーム').trim(),side:d.side||'away',inning:1,half:d.side==='away'?'top':'bottom',outs:0,
 count:{b:0,s:0},bases:{first:null,second:null,third:null},score:{us:0,them:0},innings:{us:[0],them:[0]},
 lineup:TEAM.slice(0,9).map((p,i)=>({...p,order:i+1})),bench:TEAM.slice(9).map(p=>({...p})),batterIndex:0,
 pitcher:{name:'相手投手',pitches:0,strikes:0,balls:0,BF:0,H:0,BB:0,K:0,R:0},events:[],stats:initialStats(),gameOver:false,pendingUpload:true
});
let state={view:'home',draft:freshDraft(),game:null,undo:[],redo:[],modal:null,dataTab:'bat',toast:''};
function persist(){try{localStorage.setItem('ballnote-v02',JSON.stringify({game:state.game,draft:state.draft}))}catch(e){}}
function restore(){try{const raw=localStorage.getItem('ballnote-v02');if(!raw)return;const x=JSON.parse(raw);state.game=x.game||null;state.draft=x.draft||freshDraft()}catch(e){}}
function snapshot(){if(!state.game)return;state.undo.push(clone(state.game));if(state.undo.length>100)state.undo.shift();state.redo=[]}
function toast(msg){state.toast=msg;render();setTimeout(()=>{if(state.toast===msg){state.toast='';render()}},1000)}
function event(type,label,detail=''){state.game.events.unshift({id:String(Date.now())+Math.random(),time:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}),type,label,detail})}
function batter(){return state.game?.lineup[state.game.batterIndex%state.game.lineup.length]}
function ensureInning(){const g=state.game,i=g.inning-1;while(g.innings.us.length<=i)g.innings.us.push(0);while(g.innings.them.length<=i)g.innings.them.push(0)}
function addRuns(n,batterId){if(!n)return;const g=state.game;g.score.us+=n;ensureInning();g.innings.us[g.inning-1]+=n;if(batterId)g.stats[batterId].RBI+=n;g.pitcher.R+=n}
function scoreRunner(pid){if(!pid)return 0;state.game.stats[pid].R++;return 1}
function advanceBatter(){state.game.batterIndex=(state.game.batterIndex+1)%state.game.lineup.length;state.game.count={b:0,s:0}}
function checkThreeOut(){const g=state.game;if(g.outs<3)return;g.outs=0;g.bases={first:null,second:null,third:null};g.inning++;ensureInning();event('inning',`${g.inning}回へ`,'試作版では自チーム攻撃を連続記録')}
function forceWalk(pid){const g=state.game,b=g.bases;let r=0;if(b.first&&b.second&&b.third){r+=scoreRunner(b.third);b.third=b.second;b.second=b.first;b.first=pid}else if(b.first&&b.second){b.third=b.second;b.second=b.first;b.first=pid}else if(b.first){b.second=b.first;b.first=pid}else b.first=pid;return r}
function pitch(kind){const g=state.game;if(!g||g.gameOver)return;snapshot();const bt=batter();g.pitcher.pitches++;
 if(kind==='ball'){g.pitcher.balls++;g.count.b++;event('pitch',`第${g.pitcher.pitches}球 ボール`,bt.name);if(g.count.b>=4){g.stats[bt.id].PA++;g.stats[bt.id].BB++;g.pitcher.BB++;g.pitcher.BF++;const r=forceWalk(bt.id);addRuns(r,bt.id);event('pa',`${bt.name} 四球`,r?`押し出し ${r}点`:'');advanceBatter()}}
 if(kind==='strike'||kind==='swing'){g.pitcher.strikes++;g.count.s++;event('pitch',`第${g.pitcher.pitches}球 ${kind==='strike'?'見逃しストライク':'空振り'}`,bt.name);if(g.count.s>=3){g.stats[bt.id].PA++;g.stats[bt.id].AB++;g.stats[bt.id].K++;g.pitcher.K++;g.pitcher.BF++;g.outs++;event('pa',`${bt.name} ${kind==='strike'?'見逃し三振':'空振り三振'}`);advanceBatter();checkThreeOut()}}
 if(kind==='foul'){g.pitcher.strikes++;if(g.count.s<2)g.count.s++;event('pitch',`第${g.pitcher.pitches}球 ファウル`,bt.name)}
 persist();render()}
function applyInPlay(result){const g=state.game;if(!g)return;const bt=batter();snapshot();g.pitcher.pitches++;g.pitcher.strikes++;g.pitcher.BF++;g.stats[bt.id].PA++;g.stats[bt.id].AB++;let runs=0;
 const old={...g.bases};const clear=()=>g.bases={first:null,second:null,third:null};const put=(pid,d)=>{if(!pid)return;if(d>=4)runs+=scoreRunner(pid);else if(d===3)g.bases.third=pid;else if(d===2)g.bases.second=pid;else if(d===1)g.bases.first=pid};
 const move=n=>{clear();put(old.third,3+n);put(old.second,2+n);put(old.first,1+n);put(bt.id,n)};
 if(result==='1B'){g.stats[bt.id].H++;g.pitcher.H++;move(1)}else if(result==='2B'){g.stats[bt.id].H++;g.stats[bt.id].B2++;g.pitcher.H++;move(2)}else if(result==='3B'){g.stats[bt.id].H++;g.stats[bt.id].B3++;g.pitcher.H++;move(3)}else if(result==='HR'){g.stats[bt.id].H++;g.stats[bt.id].HR++;g.pitcher.H++;move(4)}else if(result==='OUT'){g.outs++}else if(result==='E'){move(1)}else if(result==='FC'){if(old.first){g.bases={first:bt.id,second:old.second,third:old.third};g.outs++}else g.bases.first=bt.id}
 addRuns(runs,bt.id);event('pa',`${bt.name} ${resultLabel(result)}`,runs?`${runs}点`:'');advanceBatter();checkThreeOut();state.modal=null;persist();render()}
function resultLabel(r){return ({'1B':'単打','2B':'二塁打','3B':'三塁打','HR':'本塁打','OUT':'アウト','E':'失策で出塁','FC':'野選'})[r]||r}
function undo(){if(!state.undo.length)return;state.redo.push(clone(state.game));state.game=state.undo.pop();persist();toast('1つ取り消しました')}
function redo(){if(!state.redo.length)return;state.undo.push(clone(state.game));state.game=state.redo.pop();persist();toast('やり直しました')}
function nav(v){if(v==='live'&&!state.game){state.view='setup'}else state.view=v;state.modal=null;render()}
function openSetup(){state.draft=freshDraft();state.view='setup';render()}
function updateDraft(key,val){state.draft[key]=val;persist();render()}
function startGame(){state.game=freshGame(state.draft);state.undo=[];state.redo=[];state.view='live';event('system','試合開始',`${state.game.opponent} / ${state.game.side==='away'?'先攻':'後攻'}`);persist();render()}
function endGame(){if(!state.game)return;snapshot();state.game.gameOver=true;event('system','試合終了');persist();state.view='box';render()}
function setBase(base){if(!state.game)return;snapshot();const g=state.game;g.bases[base]=g.bases[base]?null:batter().id;event('edit',`${base==='first'?'一':base==='second'?'二':'三'}塁を手動変更`);persist();render()}
function substitute(id){const g=state.game;if(!g)return;const ix=g.bench.findIndex(p=>p.id===id);if(ix<0)return;snapshot();const old=batter(),incoming=g.bench.splice(ix,1)[0];incoming.order=old.order;g.lineup[g.batterIndex]=incoming;g.bench.push({...old});event('sub',`代打 ${incoming.name}`,`${old.name} OUT`);state.modal=null;persist();render()}
function resetAll(){if(!confirm('端末内の試作データを消して初期状態に戻しますか？'))return;localStorage.removeItem('ballnote-v02');state={view:'home',draft:freshDraft(),game:null,undo:[],redo:[],modal:null,dataTab:'bat',toast:''};render()}
function avg(s){return s.AB?(s.H/s.AB).toFixed(3).replace(/^0/,''):'.000'}function obp(s){const d=s.AB+s.BB;return d?((s.H+s.BB)/d).toFixed(3).replace(/^0/,''):'.000'}function slg(s){return s.AB?((s.H+s.B2*1+s.B3*2+s.HR*3)/s.AB).toFixed(3).replace(/^0/,''):'.000'}function ops(s){return (parseFloat('0'+obp(s))+parseFloat('0'+slg(s))).toFixed(3)}
function top(){return `<div class="topbar"><div class="brand"><h1>BALLNOTE <span class="small">v0.2.1</span></h1><span class="status">● 端末内保存</span></div></div>`}
function bottom(){const items=[['home','⌂','ホーム'],['live','●','試合'],['box','▦','BOX'],['data','▥','データ'],['history','↶','履歴']];return `<div class="bottomnav"><div class="navinner">${items.map(([v,i,l])=>`<button class="navbtn ${state.view===v?'active':''}" data-nav="${v}"><span class="navicon">${i}</span>${l}</button>`).join('')}</div></div>`}
function dots(n,max,c){return Array.from({length:max},(_,i)=>`<span class="dot ${i<n?'on '+c:''}"></span>`).join('')}
function diamond(g){return `<div class="diamond"><button aria-label="二塁" class="base b2 ${g.bases.second?'on':''}" data-base="second"></button><button aria-label="一塁" class="base b1 ${g.bases.first?'on':''}" data-base="first"></button><button aria-label="三塁" class="base b3 ${g.bases.third?'on':''}" data-base="third"></button><div class="base homebase"></div></div>`}
function homeView(){const g=state.game;return `<div class="content"><div class="card"><div class="big">スコアをつける</div><p class="muted">電波がなくても入力できます。試合後にアップロードして分析する前提です。</p><button class="btn primary full" data-act="new">＋ 新しい試合</button></div>${g?`<div class="card"><div class="row between"><div><strong>${g.date}</strong><div>MY TEAM vs ${g.opponent}</div><div class="muted">${g.gameOver?'試合終了':'記録中'} / ${g.pendingUpload?'未アップロード':'同期済み'}</div></div><div class="score">${g.score.us}-${g.score.them}</div></div><button class="btn outline full" style="margin-top:10px" data-nav="${g.gameOver?'box':'live'}">${g.gameOver?'結果を見る':'記録を続ける'}</button></div>`:''}<div class="card"><div class="row between"><strong>試作データ</strong><button class="btn danger" data-act="reset">初期化</button></div><div class="muted" style="margin-top:8px">実際にボタン操作・Undo/Redo・成績反映を確認できます。</div></div></div>`}
function setupView(){const d=state.draft;return `<div class="content"><div class="card"><div class="big">新しい試合</div><div class="muted">最低限だけ入力して開始できます。</div></div><div class="card stack"><div class="field"><label>試合日</label><input class="input" id="game-date" type="date" value="${d.date}"></div><div class="field"><label>相手チーム</label><input class="input" id="opponent" placeholder="例：青葉高校" value="${escapeHtml(d.opponent)}"></div><div class="field"><label>先攻 / 後攻</label><div class="seg"><button class="${d.side==='away'?'on':''}" data-side="away">先攻</button><button class="${d.side==='home'?'on':''}" data-side="home">後攻</button></div></div></div><div class="card"><div class="row between"><strong>スタメン</strong><span class="muted">変更は次段階</span></div>${TEAM.slice(0,9).map((p,i)=>`<div class="lineup-row"><span class="order">${i+1}</span><strong>${p.name}</strong><span class="pos">${p.pos}</span></div>`).join('')}<div class="muted" style="margin-top:9px">控え</div><div class="bench">${TEAM.slice(9).map(p=>`<span class="pill">${p.name}</span>`).join('')}</div></div><button class="btn primary full" data-act="start">試合を開始</button><button class="btn full" style="margin-top:8px" data-nav="home">キャンセル</button></div>`}
function liveView(){if(!state.game)return setupView();const g=state.game,bt=batter();return `<div class="content"><div class="card livehead"><div><div class="big">${g.inning}回${g.side==='away'?'表':'裏'}</div><strong>${g.outs} OUT</strong></div><div style="text-align:center"><div>MY TEAM</div><div class="score">${g.score.us}-${g.score.them}</div><div class="muted">vs ${g.opponent}</div></div>${diamond(g)}</div><div class="grid2"><div class="card"><span class="muted">打者</span><div style="font-size:22px;font-weight:900">${bt.name}</div><div class="muted">${bt.order}番 ${bt.pos}</div></div><div class="card"><span class="muted">投手</span><div style="font-size:22px;font-weight:900">${g.pitcher.name}</div><div class="muted">${g.pitcher.pitches}球</div></div></div><div class="card"><div class="counts"><div>B ${dots(g.count.b,3,'b')}</div><div>S ${dots(g.count.s,2,'s')}</div><div>O ${dots(g.outs,3,'o')}</div></div></div><div class="pitch-grid"><button class="btn ball" data-pitch="ball">BALL<br><span class="small">ボール</span></button><button class="btn strike" data-pitch="strike">STRIKE<br><span class="small">見逃し</span></button><button class="btn foul" data-pitch="foul">FOUL<br><span class="small">ファウル</span></button><button class="btn" data-pitch="swing">SWING<br><span class="small">空振り</span></button><button class="btn wide" data-act="inplay">IN PLAY<br><span class="small">打球を入力</span></button></div><div class="card"><div class="quick"><button class="btn danger" data-act="undo" ${!state.undo.length?'disabled':''}>↶ 取消</button><button class="btn outline" data-act="redo" ${!state.redo.length?'disabled':''}>↷ やり直し</button><button class="btn" data-act="sub">交代</button></div><div class="last" style="margin-top:10px"><span class="muted">最終入力</span><div><strong>${g.events[0]?.label||'まだありません'}</strong></div></div></div><div class="grid2"><button class="btn outline" data-nav="history">履歴・訂正</button><button class="btn" data-act="end">試合終了</button></div></div>`}
function boxView(){if(!state.game)return homeView();const g=state.game,max=Math.max(9,g.innings.us.length,g.innings.them.length),cols=Array.from({length:max},(_,i)=>i+1),sum=a=>a.reduce((x,y)=>x+(y||0),0),hits=Object.values(g.stats).reduce((a,s)=>a+s.H,0);return `<div class="content"><div class="card"><div class="big">ボックススコア</div><div class="muted">${g.date} / ${g.opponent}</div></div><div class="card table-wrap"><table class="tbl"><thead><tr><th>TEAM</th>${cols.map(i=>`<th>${i}</th>`).join('')}<th>R</th><th>H</th></tr></thead><tbody><tr><td>${g.opponent}</td>${cols.map((_,i)=>`<td>${g.innings.them[i]??''}</td>`).join('')}<td>${sum(g.innings.them)}</td><td>-</td></tr><tr><td>MY TEAM</td>${cols.map((_,i)=>`<td>${g.innings.us[i]??''}</td>`).join('')}<td>${sum(g.innings.us)}</td><td>${hits}</td></tr></tbody></table></div><div class="card grid2"><div><span class="muted">状態</span><div><strong>${g.gameOver?'試合終了':'記録中'}</strong></div></div><div><span class="muted">同期</span><div><strong>${g.pendingUpload?'未アップロード':'同期済み'}</strong></div></div></div></div>`}
function dataView(){if(!state.game)return homeView();const g=state.game;return `<div class="content"><div class="card"><div class="big">データ一覧</div><div class="tabs"><button class="tab ${state.dataTab==='bat'?'active':''}" data-tab="bat">打撃</button><button class="tab ${state.dataTab==='pitch'?'active':''}" data-tab="pitch">投手</button></div></div>${state.dataTab==='bat'?`<div class="card table-wrap"><table class="tbl"><thead><tr><th>選手</th><th>PA</th><th>AB</th><th>H</th><th>RBI</th><th>BB</th><th>K</th><th>AVG</th><th>OBP</th><th>OPS</th></tr></thead><tbody>${g.lineup.map(p=>{const s=g.stats[p.id]||emptyStat();return `<tr><td>${p.name}</td><td>${s.PA}</td><td>${s.AB}</td><td>${s.H}</td><td>${s.RBI}</td><td>${s.BB}</td><td>${s.K}</td><td>${avg(s)}</td><td>${obp(s)}</td><td>${ops(s)}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="card"><div class="kpi"><div><span class="muted">投球数</span><strong>${g.pitcher.pitches}</strong></div><div><span class="muted">奪三振</span><strong>${g.pitcher.K}</strong></div><div><span class="muted">与四球</span><strong>${g.pitcher.BB}</strong></div><div><span class="muted">被安打</span><strong>${g.pitcher.H}</strong></div></div></div>`}</div>`}
function historyView(){if(!state.game)return homeView();const g=state.game;return `<div class="content"><div class="card"><div class="row between"><div><div class="big">履歴・訂正</div><div class="muted">直前のミスは1タップで戻します。</div></div><button class="btn danger" data-act="undo" ${!state.undo.length?'disabled':''}>↶ 1つ戻す</button></div></div><div class="card">${g.events.length?g.events.map(e=>`<div class="event"><div class="muted">${e.time}</div><div><strong>${e.label}</strong><div class="muted">${e.detail||''}</div></div><span class="badge">${e.type}</span></div>`).join(''):'<div class="muted">履歴はまだありません。</div>'}</div></div>`}
function modalView(){if(!state.modal)return'';if(state.modal==='inplay')return `<div class="modalback" data-act="closemodal"><div class="modal" data-modal><h2>打球結果</h2><p class="muted">プレー結果を素早く選択します。</p><div class="choice-grid">${[['1B','単打'],['2B','二塁打'],['3B','三塁打'],['HR','本塁打'],['OUT','アウト'],['E','失策'],['FC','野選']].map(([r,l])=>`<button class="btn ${r==='1B'||r==='HR'?'primary':''}" data-result="${r}">${l}</button>`).join('')}</div><button class="btn full" style="margin-top:10px" data-act="closemodal">キャンセル</button></div></div>`;if(state.modal==='sub'){const g=state.game;return `<div class="modalback" data-act="closemodal"><div class="modal" data-modal><h2>代打</h2><div class="muted" style="margin-bottom:8px">現在：${batter().name}</div>${g.bench.map(p=>`<button class="btn full" style="margin-bottom:8px" data-sub="${p.id}">${p.name}（${p.pos}）</button>`).join('')||'<div class="muted">控え選手はいません。</div>'}<button class="btn full" data-act="closemodal">閉じる</button></div></div>`}return''}
function escapeHtml(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function render(){const views={home:homeView,setup:setupView,live:liveView,box:boxView,data:dataView,history:historyView};app.innerHTML=`<div class="app">${top()}${(views[state.view]||homeView)()}${state.view==='setup'?'':bottom()}${modalView()}${state.toast?`<div class="toast">${state.toast}</div>`:''}</div>`}
app.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.modal!==undefined)return;if(t.dataset.nav)return nav(t.dataset.nav);if(t.dataset.side)return updateDraft('side',t.dataset.side);if(t.dataset.pitch)return pitch(t.dataset.pitch);if(t.dataset.base)return setBase(t.dataset.base);if(t.dataset.result)return applyInPlay(t.dataset.result);if(t.dataset.sub)return substitute(t.dataset.sub);const a=t.dataset.act;if(a==='new')openSetup();else if(a==='start')startGame();else if(a==='inplay'){state.modal='inplay';render()}else if(a==='sub'){state.modal='sub';render()}else if(a==='undo')undo();else if(a==='redo')redo();else if(a==='end')endGame();else if(a==='reset')resetAll();else if(a==='closemodal'){state.modal=null;render()}});
app.addEventListener('input',e=>{if(e.target.id==='opponent')state.draft.opponent=e.target.value;if(e.target.id==='game-date')state.draft.date=e.target.value;persist()});
app.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t){state.dataTab=t.dataset.tab;render()}});
try{restore();render();}catch(e){if(window.__ballnoteBootError)window.__ballnoteBootError(e&&e.message?e.message:String(e));else throw e;}
</script>
</body>
</html>
