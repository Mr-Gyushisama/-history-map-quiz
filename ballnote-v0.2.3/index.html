<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>BALLNOTE v0.2.3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#f3f7f5;color:#102030;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:82px}.top{background:linear-gradient(135deg,#14344e,#0b6b4b);color:#fff;padding:18px 16px;display:flex;justify-content:space-between;align-items:center}.top b{font-size:21px}.status{border:1px solid #ffffff66;border-radius:99px;padding:6px 10px;font-size:12px}.content{padding:12px}.card{background:#fff;border:1px solid #dfe8e4;border-radius:17px;padding:14px;margin-bottom:12px;box-shadow:0 4px 16px #1232}.big{font-size:28px;font-weight:900}.muted{font-size:13px;color:#687887}.btn{border:0;border-radius:13px;padding:13px;font-weight:800;background:#edf3f0;color:#102030}.primary{background:#0b6b4b;color:#fff}.danger{background:#fff;border:1px solid #d73737;color:#d73737}.outline{background:#fff;border:1px solid #0b6b4b;color:#0b6b4b}.full{width:100%}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:#687887;margin-bottom:5px}.input{width:100%;border:1px solid #dfe8e4;border-radius:11px;padding:12px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#edf3f0;padding:4px;border-radius:12px}.seg button{border:0;background:transparent;border-radius:9px;padding:10px;font-weight:800}.seg .on{background:#0b6b4b;color:#fff}.line{display:grid;grid-template-columns:38px 1fr 64px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #e8eeeb}.num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#edf3f0;font-weight:900}.pos{text-align:center;background:#eaf7f0;color:#146948;border-radius:8px;padding:6px}.livehead{display:grid;grid-template-columns:1fr 1fr 104px;align-items:center;gap:8px}.score{text-align:center;font-size:31px;font-weight:900;color:#0b6b4b}.diamond{position:relative;width:96px;height:96px;margin:auto}.base{position:absolute;width:23px;height:23px;border:2px solid #91a2ac;background:#fff;transform:rotate(45deg)}.base.on{background:#f1c52a}.b2{top:4px;left:36px}.b1{top:36px;right:4px}.b3{top:36px;left:4px}.bh{left:36px;bottom:4px}.count{display:flex;justify-content:space-around;font-size:17px;font-weight:900}.dot{display:inline-block;width:17px;height:17px;border-radius:50%;background:#d9dfdd;margin-left:3px}.db{background:#14a66f}.ds{background:#e2ae00}.do{background:#dd3e3e}.pitch button{min-height:74px}.ball{background:#12a86f;color:white}.strike{background:#d7a400;color:white}.foul{background:#5c6978;color:white}.inplay{background:#0b6b4b;color:white;grid-column:span 2}.last{background:#edf9f3;border-radius:11px;padding:10px;margin-top:10px}.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dfe8e4}.navin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:#fff;padding:10px 2px;font-size:11px;color:#687887}.nav .active{color:#0b6b4b;font-weight:900}.modalbg{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:50}.modal{background:#fff;width:min(760px,100%);padding:16px;border-radius:22px 22px 0 0}.table{overflow:auto}.table table{width:100%;min-width:570px;border-collapse:collapse}.table th,.table td{padding:8px;border-bottom:1px solid #e5ece8;text-align:center;font-size:13px}.table th:first-child,.table td:first-child{text-align:left}.event{padding:9px 0;border-bottom:1px solid #e5ece8}.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#102030;color:#fff;padding:9px 14px;border-radius:99px}.error{margin:16px;padding:14px;border:1px solid #d59a00;background:#fff3d5;border-radius:12px}
</style>
</head>
<body>
<div id="app"><div class="app"><div class="top"><b>BALLNOTE v0.2.3</b><span class="status">起動中</span></div><div class="error">互換モードで起動しています。</div></div></div>
<script>
(function(){
var app=document.getElementById('app');
window.onerror=function(m){app.innerHTML='<div class="app"><div class="top"><b>BALLNOTE v0.2.3</b></div><div class="error">起動エラー: '+String(m)+'</div></div>';return false;};
var players=[],i;for(i=1;i<=12;i++)players.push({id:'p'+i,name:'選手'+(i<10?'0':'')+i,pos:i==9?'P':i==8?'C':i==1?'SS':i==2?'2B':i==3?'LF':i==4?'1B':i==5?'CF':i==6?'3B':i==7?'RF':'OF'});
function stat(){return{PA:0,AB:0,R:0,H:0,RBI:0,BB:0,K:0};}
function stats(){var x={},j;for(j=0;j<players.length;j++)x[players[j].id]=stat();return x;}
function today(){var d=new Date(),m=d.getMonth()+1,n=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(n<10?'0':'')+n;}
function game(d){var l=[],b=[],j,p;for(j=0;j<9;j++){p={id:players[j].id,name:players[j].name,pos:players[j].pos,order:j+1};l.push(p)}for(j=9;j<12;j++)b.push({id:players[j].id,name:players[j].name,pos:players[j].pos});return{date:d.date,opponent:d.opponent||'相手チーム',side:d.side,inning:1,outs:0,count:{b:0,s:0},bases:{first:null,second:null,third:null},score:0,innings:[0],lineup:l,bench:b,bi:0,pitcher:{pitches:0,H:0,BB:0,K:0},events:[],stats:stats(),scorecards:[],over:false}}
var st={view:'home',draft:{date:today(),opponent:'',side:'away'},g:null,undo:[],redo:[],modal:'',tab:'bat',toast:'',play:{shape:'G',fielder:'',target:'3'}};
function save(){try{localStorage.setItem('ballnote-v023',JSON.stringify({draft:st.draft,g:st.g}))}catch(e){}}
function load(){try{var x=JSON.parse(localStorage.getItem('ballnote-v023')||'null');if(x){if(x.draft)st.draft=x.draft;if(x.g){st.g=x.g;if(!st.g.scorecards)st.g.scorecards=[]}}}catch(e){}}
function cp(x){return JSON.parse(JSON.stringify(x))}
function snap(){if(!st.g)return;st.undo.push(cp(st.g));if(st.undo.length>80)st.undo.shift();st.redo=[]}
function bat(){return st.g.lineup[st.g.bi%st.g.lineup.length]}
function ev(t,l){st.g.events.unshift({time:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}),type:t,label:l})}
function shapeSymbol(s){return s==='G'?'ゴ':s==='F'?'飛':s==='L'?'直':s==='H'?'襲':s==='B'?'打':s==='BF'?'飛':s==='FF'?'邪':''}
function makeNotation(r){var q=st.play||{},sym=shapeSymbol(q.shape),f=q.fielder||'',t=q.target||'';if(r==='HR')return '本';if(r==='OUT'){if((q.shape==='G'||q.shape==='B')&&f&&t)return sym+f+'-'+t;return sym+f}if(r==='E')return sym+f+'E';if(r==='1B')return sym+f+' 安';if(r==='2B')return sym+f+' 二';if(r==='3B')return sym+f+' 三';return sym+f}
function addScorecard(p,n,r){if(!st.g.scorecards)st.g.scorecards=[];st.g.scorecards.push({playerId:p.id,order:p.order,inning:st.g.inning,notation:n,result:r,shape:(st.play&&st.play.shape)||'',fielder:(st.play&&st.play.fielder)||'',target:(st.play&&st.play.target)||'',outsAfter:st.g.outs})}
function next(){st.g.bi=(st.g.bi+1)%st.g.lineup.length;st.g.count={b:0,s:0}}
function inningCheck(){if(st.g.outs<3)return;st.g.outs=0;st.g.bases={first:null,second:null,third:null};st.g.inning++;if(st.g.innings.length<st.g.inning)st.g.innings.push(0);ev('inning',st.g.inning+'回へ')}
function dots(n,max,c){var o='',j;for(j=0;j<max;j++)o+='<span class="dot '+(j<n?c:'')+'"></span>';return o}
function diamond(){var b=st.g.bases;return '<div class="diamond"><button class="base b2 '+(b.second?'on':'')+'" data-base="second"></button><button class="base b1 '+(b.first?'on':'')+'" data-base="first"></button><button class="base b3 '+(b.third?'on':'')+'" data-base="third"></button><span class="base bh"></span></div>'}
function pitch(k){var g=st.g,p=bat();if(!g||g.over)return;snap();g.pitcher.pitches++;if(k==='ball'){g.count.b++;ev('pitch','ボール');if(g.count.b>=4){g.stats[p.id].PA++;g.stats[p.id].BB++;g.pitcher.BB++;if(g.bases.first&&g.bases.second&&g.bases.third){g.stats[g.bases.third].R++;g.score++;g.innings[g.inning-1]++;g.bases.third=g.bases.second;g.bases.second=g.bases.first;g.bases.first=p.id}else if(g.bases.first&&g.bases.second){g.bases.third=g.bases.second;g.bases.second=g.bases.first;g.bases.first=p.id}else if(g.bases.first){g.bases.second=g.bases.first;g.bases.first=p.id}else g.bases.first=p.id;addScorecard(p,'四球','BB');ev('pa',p.name+' 四球');next()}}else if(k==='foul'){if(g.count.s<2)g.count.s++;ev('pitch','ファウル')}else{g.count.s++;ev('pitch',k==='swing'?'空振り':'ストライク');if(g.count.s>=3){g.stats[p.id].PA++;g.stats[p.id].AB++;g.stats[p.id].K++;g.pitcher.K++;g.outs++;addScorecard(p,k==='swing'?'空三振':'見三振','K');ev('pa',p.name+' 三振');next();inningCheck()}}save();render()}
function inplay(r){var g=st.g,p=bat(),old,runs=0,note;if(!g)return;snap();g.pitcher.pitches++;g.stats[p.id].PA++;g.stats[p.id].AB++;old={first:g.bases.first,second:g.bases.second,third:g.bases.third};function score(id){if(id){g.stats[id].R++;g.score++;g.innings[g.inning-1]++;runs++}}function move(n){g.bases={first:null,second:null,third:null};if(old.third){if(3+n>=4)score(old.third);else g.bases.third=old.third}if(old.second){if(2+n>=4)score(old.second);else if(2+n==3)g.bases.third=old.second;else g.bases.second=old.second}if(old.first){if(1+n>=4)score(old.first);else if(1+n==3)g.bases.third=old.first;else if(1+n==2)g.bases.second=old.first;else g.bases.first=old.first}if(n>=4)score(p.id);else if(n==3)g.bases.third=p.id;else if(n==2)g.bases.second=p.id;else g.bases.first=p.id}
if(r==='OUT'){g.outs++}else if(r==='E'){move(1)}else if(r==='1B'){g.stats[p.id].H++;g.pitcher.H++;move(1)}else if(r==='2B'){g.stats[p.id].H++;g.pitcher.H++;move(2)}else if(r==='3B'){g.stats[p.id].H++;g.pitcher.H++;move(3)}else if(r==='HR'){g.stats[p.id].H++;g.pitcher.H++;move(4)}if(runs)g.stats[p.id].RBI+=runs;note=makeNotation(r);addScorecard(p,note,r);ev('pa',p.name+' '+note);next();inningCheck();st.modal='';st.play={shape:'G',fielder:'',target:'3'};save();render()}
function undo(){if(!st.undo.length)return;st.redo.push(cp(st.g));st.g=st.undo.pop();save();st.toast='1つ取り消しました';render();setTimeout(function(){st.toast='';render()},800)}
function redo(){if(!st.redo.length)return;st.undo.push(cp(st.g));st.g=st.redo.pop();save();st.toast='やり直しました';render();setTimeout(function(){st.toast='';render()},800)}
function nav(v){st.view=(v==='live'&&!st.g)?'setup':v;st.modal='';render()}
function top(){return '<div class="top"><b>BALLNOTE v0.2.3</b><span class="status">● 端末内保存</span></div>'}
function bottom(){var a=[['home','ホーム'],['live','試合'],['box','BOX'],['data','データ'],['history','履歴']],o='<div class="nav"><div class="navin">',j;for(j=0;j<a.length;j++)o+='<button class="'+(st.view===a[j][0]?'active':'')+'" data-nav="'+a[j][0]+'">'+a[j][1]+'</button>';return o+'</div></div>'}
function home(){var o='<div class="content"><div class="card"><div class="big">スコアをつける</div><p class="muted">試合中は端末内へ即時保存します。</p><button class="btn primary full" data-act="new">＋ 新しい試合</button></div>';if(st.g)o+='<div class="card"><b>'+st.g.date+'</b><div>MY TEAM vs '+st.g.opponent+'</div><div class="score">'+st.g.score+'-0</div><button class="btn outline full" data-nav="'+(st.g.over?'box':'live')+'">'+(st.g.over?'結果を見る':'記録を続ける')+'</button></div>';return o+'<div class="card"><b>iPhone互換モード</b><div class="muted">軽量JavaScript版</div></div></div>'}
function setup(){var d=st.draft,o='<div class="content"><div class="card"><div class="big">新しい試合</div></div><div class="card"><div class="field"><label>試合日</label><input class="input" id="date" type="date" value="'+d.date+'"></div><div class="field"><label>相手チーム</label><input class="input" id="opp" value="'+d.opponent+'"></div><div class="field"><label>先攻 / 後攻</label><div class="seg"><button class="'+(d.side==='away'?'on':'')+'" data-side="away">先攻</button><button class="'+(d.side==='home'?'on':'')+'" data-side="home">後攻</button></div></div></div><div class="card">',j;for(j=0;j<9;j++)o+='<div class="line"><span class="num">'+(j+1)+'</span><b>'+players[j].name+'</b><span class="pos">'+players[j].pos+'</span></div>';return o+'</div><button class="btn primary full" data-act="start">試合を開始</button></div>'}
function live(){var g=st.g,p;if(!g)return setup();p=bat();return '<div class="content"><div class="card livehead"><div><div class="big">'+g.inning+'回'+(g.side==='away'?'表':'裏')+'</div><b>'+g.outs+' OUT</b></div><div><div class="score">'+g.score+'-0</div><div class="muted" style="text-align:center">vs '+g.opponent+'</div></div>'+diamond()+'</div><div class="grid2"><div class="card"><span class="muted">打者</span><div class="big">'+p.name+'</div></div><div class="card"><span class="muted">投球数</span><div class="big">'+g.pitcher.pitches+'</div></div></div><div class="card"><div class="count"><div>B '+dots(g.count.b,3,'db')+'</div><div>S '+dots(g.count.s,2,'ds')+'</div><div>O '+dots(g.outs,3,'do')+'</div></div></div><div class="grid3 pitch"><button class="btn ball" data-pitch="ball">BALL</button><button class="btn strike" data-pitch="strike">STRIKE</button><button class="btn foul" data-pitch="foul">FOUL</button><button class="btn" data-pitch="swing">SWING</button><button class="btn inplay" data-act="inplay">IN PLAY</button></div><div class="card"><div class="grid3"><button class="btn danger" data-act="undo">↶ 取消</button><button class="btn outline" data-act="redo">↷ やり直し</button><button class="btn" data-act="end">試合終了</button></div><div class="last"><span class="muted">最終入力</span><br><b>'+(g.events.length?g.events[0].label:'まだありません')+'</b></div></div></div>'}
function box(){var g=st.g,o='<div class="content"><div class="card"><div class="big">スコアブック</div><div class="muted">早稲田式・打球記号対応</div></div><div class="card table"><table><tr><th>打順 / 選手</th>',j,k,p,cells,card,maxIn=9;if(!g)return home();if(g.inning>maxIn)maxIn=g.inning;for(j=1;j<=maxIn;j++)o+='<th>'+j+'</th>';o+='</tr>';for(j=0;j<g.lineup.length;j++){p=g.lineup[j];o+='<tr><td>'+p.order+' '+p.name+'</td>';for(k=1;k<=maxIn;k++){cells=[];if(g.scorecards){for(var x=0;x<g.scorecards.length;x++){card=g.scorecards[x];if(card.playerId===p.id&&card.inning===k)cells.push(card.notation)}}o+='<td style="min-width:62px;height:54px;font-weight:800">'+(cells.length?cells.join('<br>'):'')+'</td>'}o+='</tr>'}o+='</table></div><div class="card table"><table><tr><th>TEAM</th>';for(j=1;j<=maxIn;j++)o+='<th>'+j+'</th>';o+='<th>R</th></tr><tr><td>MY TEAM</td>';for(j=0;j<maxIn;j++)o+='<td>'+(typeof g.innings[j]==='number'?g.innings[j]:'')+'</td>';o+='<td>'+g.score+'</td></tr><tr><td>'+g.opponent+'</td><td colspan="'+maxIn+'"></td><td>0</td></tr></table></div></div>';return o}
function data(){var g=st.g,o='<div class="content"><div class="card"><div class="big">データ一覧</div></div><div class="card table"><table><tr><th>選手</th><th>PA</th><th>AB</th><th>H</th><th>RBI</th><th>BB</th><th>K</th></tr>',j,p,s;if(!g)return home();for(j=0;j<g.lineup.length;j++){p=g.lineup[j];s=g.stats[p.id];o+='<tr><td>'+p.name+'</td><td>'+s.PA+'</td><td>'+s.AB+'</td><td>'+s.H+'</td><td>'+s.RBI+'</td><td>'+s.BB+'</td><td>'+s.K+'</td></tr>'}return o+'</table></div></div>'}
function history(){var g=st.g,o='<div class="content"><div class="card"><div class="big">履歴・訂正</div><button class="btn danger full" data-act="undo">↶ 直前を取り消す</button></div><div class="card">',j;if(!g)return home();if(!g.events.length)o+='<div class="muted">履歴はまだありません</div>';else for(j=0;j<g.events.length;j++)o+='<div class="event"><b>'+g.events[j].label+'</b><div class="muted">'+g.events[j].time+' / '+g.events[j].type+'</div></div>';return o+'</div></div>'}
function modal(){var q=st.play||{shape:'G',fielder:'',target:'3'},o,j;if(st.modal!=='inplay')return'';o='<div class="modalbg"><div class="modal"><h2>打球を記録</h2><div class="muted">球筋</div><div class="grid3">';var shapes=[['G','ゴロ','ゴ'],['F','フライ','飛'],['L','ライナー','直'],['H','強襲','襲'],['B','バント','打'],['BF','バント飛球','飛'],['FF','ファウル飛球','邪']];for(j=0;j<shapes.length;j++)o+='<button class="btn '+(q.shape===shapes[j][0]?'primary':'')+'" data-shape="'+shapes[j][0]+'">'+shapes[j][2]+' '+shapes[j][1]+'</button>';o+='</div><div class="muted" style="margin-top:12px">処理した野手</div><div class="grid3">';for(j=1;j<=9;j++)o+='<button class="btn '+(String(j)===q.fielder?'primary':'')+'" data-fielder="'+j+'">'+j+'</button>';o+='</div>';if(q.shape==='G'||q.shape==='B'){o+='<div class="muted" style="margin-top:12px">送球先（通常は3＝一塁）</div><div class="grid3">';for(j=1;j<=9;j++)o+='<button class="btn '+(String(j)===q.target?'primary':'')+'" data-target="'+j+'">'+j+'</button>';o+='</div>'}o+='<div class="muted" style="margin-top:12px">結果</div><div class="grid3"><button class="btn primary" data-result="1B">単打</button><button class="btn" data-result="2B">二塁打</button><button class="btn" data-result="3B">三塁打</button><button class="btn primary" data-result="HR">本塁打</button><button class="btn" data-result="OUT">アウト</button><button class="btn" data-result="E">失策</button></div><div class="last"><b>表記プレビュー：'+makeNotation('OUT')+'</b></div><button class="btn full" data-act="close" style="margin-top:10px">閉じる</button></div></div>';return o}
function render(){var v=st.view==='setup'?setup():st.view==='live'?live():st.view==='box'?box():st.view==='data'?data():st.view==='history'?history():home();app.innerHTML='<div class="app">'+top()+v+(st.view==='setup'?'':bottom())+modal()+(st.toast?'<div class="toast">'+st.toast+'</div>':'')+'</div>'}
function btn(x){while(x&&x!==app){if(x.tagName&&x.tagName.toLowerCase()==='button')return x;x=x.parentNode}return null}
app.addEventListener('click',function(e){var t=btn(e.target),a;if(!t)return;if(t.getAttribute('data-nav'))return nav(t.getAttribute('data-nav'));if(t.getAttribute('data-side')){st.draft.side=t.getAttribute('data-side');save();return render()}if(t.getAttribute('data-pitch'))return pitch(t.getAttribute('data-pitch'));if(t.getAttribute('data-shape')){st.play.shape=t.getAttribute('data-shape');return render()}if(t.getAttribute('data-fielder')){st.play.fielder=t.getAttribute('data-fielder');return render()}if(t.getAttribute('data-target')){st.play.target=t.getAttribute('data-target');return render()}if(t.getAttribute('data-base')){snap();st.g.bases[t.getAttribute('data-base')]=st.g.bases[t.getAttribute('data-base')]?null:bat().id;save();return render()}if(t.getAttribute('data-result'))return inplay(t.getAttribute('data-result'));a=t.getAttribute('data-act');if(a==='new'){st.draft={date:today(),opponent:'',side:'away'};st.view='setup';render()}else if(a==='start'){st.g=game(st.draft);st.undo=[];st.redo=[];st.view='live';ev('system','試合開始');save();render()}else if(a==='inplay'){st.play={shape:'G',fielder:'',target:'3'};st.modal='inplay';render()}else if(a==='close'){st.modal='';render()}else if(a==='undo')undo();else if(a==='redo')redo();else if(a==='end'){snap();st.g.over=true;ev('system','試合終了');save();st.view='box';render()}});
app.addEventListener('input',function(e){if(e.target.id==='opp')st.draft.opponent=e.target.value;if(e.target.id==='date')st.draft.date=e.target.value;save()});
load();render();
})();
</script>
</body></html>
