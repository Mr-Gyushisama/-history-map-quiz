<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>歴史 1問1答</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0}h1{font-size:27px}h2{font-size:20px;margin:0 0 10px}button{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:#e5e7eb}.primary{background:#111827;color:#fff;width:100%}.weak{background:#fff3cd;color:#7a4b00;border:2px solid #f2cf66;width:100%;margin-top:10px}.q{font-size:21px;font-weight:800;line-height:1.5;margin:18px 0}.hide{display:none!important}.muted{color:#6b7280}.inp{width:100%;font-size:20px;padding:16px;border:2px solid #cbd5e1;border-radius:12px;margin-bottom:12px}.ans{font-size:20px;font-weight:800;margin:14px 0}.bar{height:9px;background:#e5e7eb;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#111827}.weaklist{margin:8px 0 0;padding-left:22px;line-height:1.7}.hiddencompat{display:none}</style></head><body><main><h1>歴史 1問1答</h1><div id="home"><div class="card"><h2>学習状況</h2><p class="muted">70問からランダム出題。10回正解した問題は通常出題から除外します。</p><div id="stats"></div></div><div class="card"><button class="primary" onclick="start(false)">ランダム学習開始</button><button id="weakBtn" class="weak" onclick="startWeak()">よく間違える問題を復習</button></div><div id="weakCard" class="card"><h2>よく間違える問題</h2><div id="weakSummary" class="muted">まだ記録がありません。間違えた問題がここに表示されます。</div><ol id="weakList" class="weaklist"></ol></div></div><div id="quiz" class="card hide"><div class="bar"><i id="prog"></i></div><p id="meta" class="muted"></p><div id="map" class="hide"></div><div id="q" class="q"></div><input id="input" class="inp" placeholder="答えを入力" autocomplete="off"><button id="check" class="primary" onclick="check()">答え合わせ</button><div id="ans" class="ans hide"></div><button id="next" class="primary hide" onclick="advance()">次の問題へ</button><p><button onclick="location.reload()">終了して戻る</button></p></div><button id="bh" class="hiddencompat"></button><button id="bm" class="hiddencompat"></button></main><script src="app-v3.js?v=20260826-11"></script><script>
kind='h';
let W={};try{W=JSON.parse(localStorage.getItem('historyWrong')||'{}')}catch(e){}
function saveW(){localStorage.setItem('historyWrong',JSON.stringify(W))}
function isCorrect(v,a){let ok=norm(v)===norm(a);if(a==='シャカ')ok=['シャカ','釈迦','釈迦牟尼'].some(x=>norm(v)===norm(x));if(a==='銅鐸')ok=['銅鐸','銅剣','銅矛'].some(x=>norm(v)===norm(x));if(a==='火・言葉')ok=norm(v).includes('火')&&norm(v).includes('言葉');if(a==='農耕・牧畜')ok=norm(v).includes('農耕')&&norm(v).includes('牧畜');if(a==='青銅器・鉄器')ok=norm(v).includes('青銅器')&&norm(v).includes('鉄器');if(a==='魏・呉・蜀')ok=['魏','呉','蜀'].every(x=>v.includes(x));return ok}
const oldCheck=check;check=function(){const v=$('input').value.trim();if(v&&!isCorrect(v,H[current][1])){W[current]=(W[current]||0)+1;saveW()}oldCheck()}
render=function(){kind='h';const master=H.filter((_,i)=>(D.h[i]||0)>=10).length;$('stats').textContent=`習得済み ${master}/70　残り ${70-master}問`;renderWeak()}
function weakItems(){return Object.keys(W).map(Number).filter(i=>W[i]>0).sort((a,b)=>W[b]-W[a])}
function renderWeak(){const items=weakItems(),list=$('weakList'),sum=$('weakSummary'),btn=$('weakBtn');list.innerHTML='';if(!items.length){sum.textContent='まだ記録がありません。間違えた問題がここに表示されます。';btn.disabled=true;btn.style.opacity='.45';return}btn.disabled=false;btn.style.opacity='1';sum.textContent=`間違い記録のある問題 ${items.length}問（間違い回数が多い順）`;items.slice(0,5).forEach(i=>{const li=document.createElement('li');li.textContent=`${H[i][0]}（${W[i]}回）`;list.appendChild(li)})}
function startWeak(){order=weakItems();if(!order.length)return alert('まだ間違い記録がありません');pos=0;$('home').classList.add('hide');$('quiz').classList.remove('hide');showQ()}
render();
</script></body></html>
