<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>歴史・世界地図 1問1答</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0}h1{font-size:25px}.tabs{display:flex;gap:8px}.tabs button{flex:1}button{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:#e5e7eb}.primary{background:#111827;color:#fff;width:100%}.q{font-size:21px;font-weight:800;line-height:1.5;margin:18px 0}.hide{display:none!important}.muted{color:#6b7280}.inp{width:100%;font-size:20px;padding:16px;border:2px solid #cbd5e1;border-radius:12px;margin-bottom:12px}.ans{font-size:20px;font-weight:800;margin:14px 0}.map{position:relative;width:100%;height:340px;overflow:hidden;border:2px solid #cbd5e1;border-radius:14px;background:#dbeafe}.map svg{width:100%;height:100%;display:block}.maplabel{position:absolute;left:10px;top:10px;background:#111827e8;color:#fff;padding:7px 11px;border-radius:9px;font-weight:800;font-size:13px;z-index:5}.bar{height:9px;background:#e5e7eb;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#111827}</style></head><body><main><h1>歴史・世界地図 1問1答</h1><div id="home"><div class="card"><div class="tabs"><button id="bh" onclick="setKind('h')">歴史70問</button><button id="bm" onclick="setKind('m')">世界地図60問</button></div><p class="muted">答えを入力して採点。10回正解で通常出題から除外します。</p><div id="stats"></div></div><div class="card"><button class="primary" onclick="start(false)">ランダム学習開始</button></div></div><div id="quiz" class="card hide"><div class="bar"><i id="prog"></i></div><p id="meta" class="muted"></p><div id="map" class="map hide"><div class="maplabel">地図を準備中…</div><svg id="mapsvg" viewBox="0 0 1000 520" preserveAspectRatio="xMidYMid meet"><g id="mapg"></g></svg></div><div id="q" class="q"></div><input id="input" class="inp" placeholder="答えを入力" autocomplete="off"><button id="check" class="primary" onclick="check()">答え合わせ</button><div id="ans" class="ans hide"></div><button id="next" class="primary hide" onclick="advance()">次の問題へ</button><p><button onclick="location.reload()">終了して戻る</button></p></div></main><script src="app-v3.js?v=20260826-4"></script><script>
const ISO=['CHN','KOR','PRK','MNG','VNM','KHM','THA','MMR','MYS','SGP','IDN','PHL','IND','PAK','AFG','KAZ','IRN','IRQ','SAU','TUR','EGY','DZA','SOM','ETH','KEN','CMR','NGA','GHA','CIV','ZAF','GBR','IRL','NLD','DNK','DEU','FRA','ESP','PRT','ITA','GRC','ROU','AUT','POL','FIN','SWE','NOR','ISL','UKR','RUS','USA','CAN','MEX','CUB','ECU','BRA','PER','CHL','ARG','AUS','NZL'];
let geo=null,loading=false;
function proj(pt){return[(pt[0]+180)/360*1000,(90-pt[1])/180*520]}
function rings(g){if(g.type==='Polygon')return g.coordinates;if(g.type==='MultiPolygon')return g.coordinates.flat();return[]}
function pathOf(f){let d='';rings(f.geometry).forEach(r=>{r.forEach((p,i)=>{const q=proj(p);d+=(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)});d+='Z'});return d}
function isoOf(f){const p=f.properties||{};return p.iso_a3||p.ISO_A3||p.ADM0_A3||p.code||''}
function drawMap(){if(kind!=='m'||!geo)return;const iso=ISO[current],f=geo.features.find(x=>isoOf(x)===iso),g=document.getElementById('mapg'),svg=document.getElementById('mapsvg'),lab=document.querySelector('.maplabel');if(!f){lab.textContent='対象国の地図データがありません';return}g.innerHTML='';let target=null;geo.features.forEach(x=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',pathOf(x));const hit=isoOf(x)===iso;p.setAttribute('fill',hit?'#ef4444':'#fff');p.setAttribute('stroke',hit?'#991b1b':'#94a3b8');p.setAttribute('stroke-width',hit?'2.5':'0.8');p.setAttribute('vector-effect','non-scaling-stroke');g.appendChild(p);if(hit)target=p});if(!target){lab.textContent='対象国を表示できません';return}requestAnimationFrame(()=>{try{const bb=target.getBBox();let pad=Math.max(bb.width,bb.height)*1.5;if(['SGP','KOR','PRK','NLD','DNK','IRL','CUB'].includes(iso))pad=Math.max(bb.width,bb.height)*3.5;pad=Math.max(pad,20);svg.setAttribute('viewBox',(bb.x-pad)+' '+(bb.y-pad)+' '+Math.max(bb.width+pad*2,40)+' '+Math.max(bb.height+pad*2,40));lab.textContent='赤く塗られた国を答えよう'}catch(e){lab.textContent='赤く塗られた国を答えよう'}})}
function loadGeo(){if(geo){drawMap();return}if(loading)return;loading=true;const lab=document.querySelector('.maplabel');lab.textContent='地図を読み込み中…';const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),12000);fetch('https://raw.githubusercontent.com/gcj2450/world-geo-json-zh/main/world.zh.json',{cache:'force-cache',signal:ctrl.signal}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(j=>{clearTimeout(timer);geo=j;loading=false;drawMap()}).catch(e=>{clearTimeout(timer);loading=false;console.error(e);lab.textContent='地図を取得できません。再読み込みしてください'})}
const baseShowQ=showQ;showQ=function(){baseShowQ();if(kind==='m'){document.getElementById('q').textContent='赤く塗られている国の名前を答えなさい。';loadGeo()}};
</script></body></html>
