<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>歴史・世界地図 1問1答</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0}h1{font-size:25px}.tabs{display:flex;gap:8px}.tabs button{flex:1}button{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:#e5e7eb}.primary{background:#111827;color:#fff;width:100%}.q{font-size:21px;font-weight:800;line-height:1.5;margin:18px 0}.hide{display:none!important}.muted{color:#6b7280}.inp{width:100%;font-size:20px;padding:16px;border:2px solid #cbd5e1;border-radius:12px;margin-bottom:12px}.ans{font-size:20px;font-weight:800;margin:14px 0}.map{position:relative;width:100%;height:340px;overflow:hidden;border:2px solid #cbd5e1;border-radius:14px;background:#dbeafe}.maplabel{position:absolute;left:10px;top:10px;background:#111827e8;color:#fff;padding:7px 11px;border-radius:9px;font-weight:800;font-size:13px;z-index:1000}.bar{height:9px;background:#e5e7eb;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#111827}.leaflet-control-attribution{font-size:8px}.leaflet-container{background:#dbeafe}</style></head><body><main><h1>歴史・世界地図 1問1答</h1><div id="home"><div class="card"><div class="tabs"><button id="bh" onclick="setKind('h')">歴史70問</button><button id="bm" onclick="setKind('m')">世界地図60問</button></div><p class="muted">答えを入力して採点。10回正解で通常出題から除外します。</p><div id="stats"></div></div><div class="card"><button class="primary" onclick="start(false)">ランダム学習開始</button></div></div><div id="quiz" class="card hide"><div class="bar"><i id="prog"></i></div><p id="meta" class="muted"></p><div id="map" class="map hide"><div class="maplabel">赤く塗られた国を答えよう</div></div><div id="q" class="q"></div><input id="input" class="inp" placeholder="答えを入力" autocomplete="off"><button id="check" class="primary" onclick="check()">答え合わせ</button><div id="ans" class="ans hide"></div><button id="next" class="primary hide" onclick="advance()">次の問題へ</button><p><button onclick="location.reload()">終了して戻る</button></p></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app-v3.js?v=20260826-2"></script><script>
const ISO=['CHN','KOR','PRK','MNG','VNM','KHM','THA','MMR','MYS','SGP','IDN','PHL','IND','PAK','AFG','KAZ','IRN','IRQ','SAU','TUR','EGY','DZA','SOM','ETH','KEN','CMR','NGA','GHA','CIV','ZAF','GBR','IRL','NLD','DNK','DEU','FRA','ESP','PRT','ITA','GRC','ROU','AUT','POL','FIN','SWE','NOR','ISL','UKR','RUS','USA','CAN','MEX','CUB','ECU','BRA','PER','CHL','ARG','AUS','NZL'];
let lmap=null,countries=null,targetLayer=null;
function initMap(){if(lmap)return;lmap=L.map('map',{zoomControl:false,attributionControl:false,scrollWheelZoom:false,doubleClickZoom:false,dragging:false,touchZoom:false,boxZoom:false,keyboard:false});lmap.setView([20,0],2);fetch('https://cdn.jsdelivr.net/gh/datasets/geo-countries@master/data/countries.geojson').then(r=>r.json()).then(g=>{countries=g;drawCountry()}).catch(()=>{document.querySelector('.maplabel').textContent='地図データを読み込めませんでした';});}
function isoOf(f){const p=f.properties||{};return p['ISO3166-1-Alpha-3']||p.ISO_A3||p.ADM0_A3||p.iso_a3||''}
function drawCountry(){if(!lmap||!countries||kind!=='m')return;if(targetLayer){lmap.removeLayer(targetLayer);targetLayer=null}const iso=ISO[current];const f=countries.features.find(x=>isoOf(x)===iso);if(!f)return;L.geoJSON(countries,{style:x=>({color:'#9ca3af',weight:1,fillColor:'#ffffff',fillOpacity:1}),interactive:false}).addTo(lmap);targetLayer=L.geoJSON(f,{style:{color:'#991b1b',weight:3,fillColor:'#ef4444',fillOpacity:.9},interactive:false}).addTo(lmap);const b=targetLayer.getBounds();const tiny=['SGP','KOR','PRK','NLD','DNK','IRL'].includes(iso);lmap.fitBounds(b.pad(tiny?2.8:1.15),{animate:false,maxZoom:tiny?7:5});setTimeout(()=>lmap.invalidateSize(),50)}
const baseShowQ=showQ;showQ=function(){baseShowQ();if(kind==='m'){document.getElementById('q').textContent='赤く塗られている国の名前を答えなさい。';initMap();setTimeout(drawCountry,80)}};
</script></body></html>
