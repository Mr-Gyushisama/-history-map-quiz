s="bar"><i id="prog"></i></div><p id="meta" class="muted"></p><div id="map" class="map hide"><div class="maplabel">この地域を見て答えよう</div><img id="mapimg" src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/69/BlankMap-World3.svg/1280px-BlankMap-World3.svg.png"><div id="pin" class="pin"></div></div><div id="q" class="q"></div><input id="input" class="inp" placeholder="答えを入力" autocomplete="off"><button id="check" class="primary" onclick="check()">答え合わせ</button><div id="ans" class="ans hide"></div><button id="next" class="primary hide" onclick="advance()">次の問題へ</button><p><button onclick="location.reload()">終了して戻る</button></p></div></main><script src="app-v3.js?v=20260826-2"></script><script>const oldShowQ=showQ;showQ=function(){oldShowQ();if(kind!=='m')return;const lat=P[current][0],lon=P[current][1],map=document.getElementById('map'),img=document.getElementById('mapimg'),pin=document.getElementById('pin');let zoom=2.4;if(Math.abs(lat)>55)zoom=2.0;if((lon>-15&&lon<35&&lat>35&&lat<65)||M[current]==='大韓民国'||M[current]==='朝鮮民主主義人民共和国'||M[current]==='シンガポール')zoom=3.4;const x=(lon+180)/360,y=(90-lat)/180;img.style.transformOrigin=(x*100)+'% '+(y*100)+'%';img.style.transform='scale('+zoom+')';pin.style.left='50%';pin.style.top='50%';pin.style.width='24px';pin.style.height='24px';document.querySelector('.maplabel').textContent='周辺国との位置関係から答えよう';};</script></body></html>
