<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>歴史・世界地図 1問1答</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0}h1{font-size:25px}.tabs{display:flex;gap:8px}.tabs button{flex:1}button{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:#e5e7eb}.primary{background:#111827;color:#fff;width:100%}.q{font-size:21px;font-weight:800;line-height:1.5;margin:18px 0}.hide{display:none!important}.muted{color:#6b7280}.inp{width:100%;font-size:20px;padding:16px;border:2px solid #cbd5e1;border-radius:12px;margin-bottom:12px}.ans{font-size:20px;font-weight:800;margin:14px 0}.map{position:relative;width:100%;height:340px;overflow:hidden;border:2px solid #cbd5e1;border-radius:14px;background:#dbeafe}.map svg{width:100%;height:100%;display:block}.maplabel{position:absolute;left:10px;top:10px;background:#111827e8;color:#fff;padding:7px 11px;border-radius:9px;font-weight:800;font-size:13px;z-index:5}.bar{height:9px;background:#e5e7eb;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#111827}#pin{display:none}</style></head><body><main><h1>歴史・世界地図 1問1答</h1><div id="home"><div class="card"><div class="tabs"><button id="bh" onclick="setKind('h')">歴史70問</button><button id="bm" onclick="setKind('m')">世界地図60問</button></div><p class="muted">答えを入力して採点。10回正解で通常出題から除外します。</p><div id="stats"></div></div><div class="card"><button class="primary" onclick="start(false)">ランダム学習開始</button></div></div><div id="quiz" class="card hide"><div class="bar"><i id="prog"></i></div><p id="meta" class="muted"></p><div id="map" class="map hide"><div class="maplabel">赤い印の国を答えよう</div><div id="pin"></div><svg id="mapsvg" viewBox="0 0 1000 520" preserveAspectRatio="xMidYMid meet"><rect width="1000" height="520" fill="#dbeafe"/><g id="grid"></g><g id="marker"></g></svg></div><div id="q" class="q"></div><input id="input" class="inp" placeholder="答えを入力" autocomplete="off"><button id="check" class="primary" onclick="check()">答え合わせ</button><div id="ans" class="ans hide"></div><button id="next" class="primary hide" onclick="advance()">次の問題へ</button><p><button onclick="location.reload()">終了して戻る</button></p></div></main><script src="app-v3.js?v=20260826-6"></script><script>
function drawLocalMap(){if(kind!=='m')return;const lat=P[current][0],lon=P[current][1],grid=document.getElementById('grid'),m=document.getElementById('marker');let spanLon=70,spanLat=45;if(Math.abs(lat)>55){spanLon=100;spanLat=50}let minLon=lon-spanLon/2,maxLon=lon+spanLon/2,minLat=Math.max(-60,lat-spanLat/2),maxLat=Math.min(85,lat+spanLat/2);function xy(la,lo){return[(lo-minLon)/(maxLon-minLon)*1000,(maxLat-la)/(maxLat-minLat)*520]}grid.innerHTML='';for(let lo=Math.ceil(minLon/10)*10;lo<=maxLon;lo+=10){let a=xy(minLat,lo),b=xy(maxLat,lo),l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',a[0]);l.setAttribute('y1',a[1]);l.setAttribute('x2',b[0]);l.setAttribute('y2',b[1]);l.setAttribute('stroke','#b8c7d9');l.setAttribute('stroke-width','1');grid.appendChild(l)}for(let la=Math.ceil(minLat/10)*10;la<=maxLat;la+=10){let a=xy(la,minLon),b=xy(la,maxLon),l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',a[0]);l.setAttribute('y1',a[1]);l.setAttribute('x2',b[0]);l.setAttribute('y2',b[1]);l.setAttribute('stroke','#b8c7d9');l.setAttribute('stroke-width','1');grid.appendChild(l)}const p=xy(lat,lon);m.innerHTML='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="25" fill="#ef4444" stroke="#991b1b" stroke-width="7"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="7" fill="#fff"/>';document.querySelector('.maplabel').textContent='赤い印の位置にある国を答えよう'}
const baseShowQ=showQ;showQ=function(){baseShowQ();if(kind==='m'){document.getElementById('q').textContent='赤い印の位置にある国の名前を答えなさい。';drawLocalMap()}};
</script></body></html>
