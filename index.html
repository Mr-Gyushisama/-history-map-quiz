<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>歴史・世界地図 1問1答</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}main{max-width:720px;margin:auto;padding:18px}h1{font-size:25px;margin:8px 0 16px}.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 4px 18px #00000010}.tabs{display:flex;gap:8px}.tabs button{flex:1}button{border:0;border-radius:12px;padding:14px 12px;font-size:16px;font-weight:700;background:#e5e7eb;color:#111827}.primary{background:#111827;color:#fff;width:100%}.q{font-size:21px;font-weight:800;line-height:1.6;margin:22px 0}.ans{font-size:24px;font-weight:900;padding:18px 0}.hide{display:none}.muted{color:#6b7280;font-size:14px}.bar{height:9px;background:#e5e7eb;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#111827}.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ok{background:#dcfce7}.ng{background:#fee2e2}.stats{font-weight:700;line-height:1.8}.badge{display:inline-block;background:#eef2ff;border-radius:99px;padding:5px 10px;margin:3px;font-size:13px}.num{font-size:52px;font-weight:900;text-align:center;margin:15px}</style></head><body><main><h1>歴史・世界地図 1問1答</h1><div id="home"><div class="card"><div class="tabs"><button id="bh" onclick="setKind('h')">歴史70問</button><button id="bm" onclick="setKind('m')">世界地図60問</button></div><p class="muted">毎回ランダム出題。各問題は10回正解すると「習得済み」になり、通常出題から自動除外されます。</p><div id="stats" class="stats"></div></div><div class="card"><button class="primary" onclick="start(false)">ランダム学習開始</button><p><button style="width:100%" onclick="start(true)">習得済みも含めて出題</button></p><button style="width:100%" onclick="resetData()">学習記録をリセット</button></div></div><div id="quiz" class="card hide"><div class="bar"><i id="prog"></i></div><p id="meta" class="muted"></p><div id="mapnum" class="num hide"></div><div id="q" class="q"></div><div id="ans" class="ans hide"></div><button id="show" class="primary" onclick="showAnswer()">答えを見る</button><div id="judge" class="judge hide"><button class="ng" onclick="mark(false)">× 不正解</button><button class="ok" onclick="mark(true)">○ 正解</button></div><p><button onclick="goHome()">終了して戻る</button></p></div></main><script>
const H=[
['現在発見されている、最古の人類は何とよばれているか。','猿人'],['1の人類の骨は、どの大陸で発見されたか。','アフリカ大陸'],['1の人類は、今からおよそ何百万年前に生存していたか。','約700万年前'],['約240万年前に進化した人類を何というか。','原人'],['4の人類が使用できるようになったことを2つ。','火・言葉'],['20万年ほど前に現れた現在の人類の直接の祖先にあたる人類を何というか。','新人'],['6の人類まで使用した石を打ち欠いて作った道具を何というか。','打製石器'],['7の道具を使い、狩りや採集をしていた時代を何というか。','旧石器時代'],['すばやい小型動物を狩るために使い始めた道具は何か。','弓矢'],['約1万年前、人類は狩りや採集以外にどんなことをして生活するようになったか。','農耕・牧畜'],['磨製石器を使うようになった10の時代を何というか。','新石器時代'],['チグリス・ユーフラテス川の流域で発達した文明を何というか。','メソポタミア文明'],['12の文明で作られた法典を何というか。','ハンムラビ法典'],['12の文明で使われた文字を何というか。','くさび形文字'],['12の文明で発明された月の満ち欠けをもとにした暦を何というか。','太陰暦'],['エジプトの文明は何という川の流域に発達したか。','ナイル川'],['エジプト文明で石を積み重ねて作られた巨大な建造物を何というか。','ピラミッド'],['エジプト文明で使われた1年を365日とする暦を何というか。','太陽暦'],['エジプト文明で使われた文字を何というか。','象形文字'],['紀元前1000年ごろから使われ始めた金属器は何か。','鉄器'],['インダス文明の代表的な遺跡は何か。','モヘンジョ・ダロ'],['紀元前1600年ごろに黄河流域につくられた国を何というか。','殷'],['22の国で発達した金属器は何か。','青銅器'],['22のころの中国で生まれた漢字のもとになった文字を何というか。','甲骨文字'],['中国で紀元前11世紀に22の後に生まれた国を何というか。','周'],['孔子の教えを何というか。','儒教'],['紀元前221年に初めて中国を統一した国を何というか。','秦'],['27の国で北方の遊牧民族の侵入を防ぐために築いたものは何か。','万里の長城'],['28を築いた人物は誰か。','始皇帝'],['紀元前202年に中国を統一し大帝国を築いた国を何というか。','漢'],['30の国で紀元前2世紀ごろに発明されたものは何か。','紙'],['30の国とローマ帝国を結んだ道を何というか。','シルクロード'],['3世紀初めに漢が滅んだ後、中国でできた3つの国は何か。','魏・呉・蜀'],['4世紀に中国の郡を滅ぼした、朝鮮半島北部におこった国を何というか。','高句麗'],['朝鮮半島南西部におこった、日本に仏教を伝えた国を何というか。','百済'],['朝鮮半島南東部におこった、後に朝鮮を統一した国を何というか。','新羅'],['紀元前8世紀ごろ、ギリシャ人が各地に建設した小さな国を何というか。','ポリス'],['アテネの小高い丘につくられた神殿を何というか。','パルテノン神殿'],['紀元前4世紀、アジアにまで及ぶ遠征を行ったマケドニアの王は誰か。','アレクサンドロス大王'],['39の王の遠征により生まれ、中国や日本にも影響を与えた文化は何か。','ヘレニズム文化'],['イタリア半島から地中海地域を支配し、共和政から帝政となった帝国を何というか。','ローマ帝国'],['41の時代にローマにつくられた円形の闘技場を何というか。','コロッセオ'],['紀元前6世紀ごろのインドでおこり、朝鮮半島を経て日本にも広まった宗教は何か。','仏教'],['苦しみからの救済を説いた43の宗教を開いた人物は誰か。','シャカ（釈迦）'],['インドでその後広まった多神教の宗教は何か。','ヒンドゥー教'],['古代オリエントで紀元前6世紀に生まれた一神教は何か。','ユダヤ教'],['ローマ帝国に支配されたパレスチナで紀元前後に生まれた宗教は何か。','キリスト教'],['46の指導者を批判し、神の前で人は平等であることを説いた人物は誰か。','イエス'],['7世紀にアラビア半島でおこり、アジアや北アフリカなどに広まった宗教を何というか。','イスラム教'],['49の宗教をおこした、唯一神アッラーを信じることを説いた人物は誰か。','ムハンマド'],['49の宗教の聖典を何というか。','コーラン'],['食べ物の調理や保存に使った、日本の最初のころの土器を何というか。','縄文土器'],['52の土器の時代に人々はどんな住居に住んでいたか。','竪穴住居'],['この時代に木をくりぬいてつくられた舟を何というか。','丸木舟'],['この時代にまじないに用いられたと考えられる人形は何か。','土偶'],['この時代のごみ捨て場のあとを何というか。','貝塚'],['大型建物の巨大な柱が掘り出された、青森県の大きなムラの遺跡は何か。','三内丸山遺跡'],['この時代の後半に中国や朝鮮から伝わってきた農業は何か。','稲作'],['58が日本に広まり農業をするようになった時代を何というか。','弥生時代'],['稲の穂を収穫した後、蓄えるためにつくられた共同の倉庫を何というか。','高床倉庫'],['59の時代に伝わった金属器を2つ。','青銅器・鉄器'],['この時代に使われた、稲の穂を収穫する石器を何というか。','石包丁'],['この時代に祭りの道具として使われた青銅器を1つ。','銅鐸（銅剣・銅矛でも可）'],['稲の穂を刈る道具として使われた石器を何というか。','石包丁'],['この時代の代表的な遺跡で佐賀県にある遺跡を何というか。','吉野ヶ里遺跡'],['1世紀ごろ、中国では当時の日本のことを何とよんでいたか。','倭'],['1世紀ごろ、漢の皇帝から送られた金印には何と書いてあったか。','漢委奴国王'],['3世紀ごろに日本にあった、女王が治めていた国を何というか。','邪馬台国'],['68の国の女王の名を何というか。','卑弥呼'],['この国のことが書いてある中国の書物の名を何というか。','魏志倭人伝']];
const M=['中華人民共和国','大韓民国','朝鮮民主主義人民共和国','モンゴル','ベトナム','カンボジア','タイ','ミャンマー','マレーシア','シンガポール','インドネシア','フィリピン','インド','パキスタン','アフガニスタン','カザフスタン','イラン','イラク','サウジアラビア','トルコ','エジプト','アルジェリア','ソマリア','エチオピア','ケニア','カメルーン','ナイジェリア','ガーナ','コートジボワール','南アフリカ共和国','イギリス','アイルランド','オランダ','デンマーク','ドイツ','フランス','スペイン','ポルトガル','イタリア','ギリシャ','ルーマニア','オーストリア','ポーランド','フィンランド','スウェーデン','ノルウェー','アイスランド','ウクライナ','ロシア連邦','アメリカ合衆国','カナダ','メキシコ','キューバ','エクアドル','ブラジル','ペルー','チリ','アルゼンチン','オーストラリア','ニュージーランド'];
let kind='h',order=[],pos=0,current=null;let D={h:{},m:{}};try{D=JSON.parse(localStorage.getItem('hmq')||'{"h":{},"m":{}}')}catch(e){};if(!D.h)D.h={};if(!D.m)D.m={};const $=id=>document.getElementById(id);function setKind(k){kind=k;render()}function render(){let a=kind==='h'?H:M,r=D[kind],master=a.filter((_,i)=>(r[i]||0)>=10).length,total=a.reduce((s,_,i)=>s+(r[i]||0),0);$('stats').innerHTML=`${kind==='h'?'歴史':'世界地図'}：習得済み ${master}/${a.length}<br>累計正解 ${total}回`; $('bh').style.background=kind==='h'?'#111827':'#e5e7eb';$('bh').style.color=kind==='h'?'#fff':'#111827';$('bm').style.background=kind==='m'?'#111827':'#e5e7eb';$('bm').style.color=kind==='m'?'#fff':'#111827'}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(all){let a=kind==='h'?H:M,r=D[kind];order=a.map((_,i)=>i).filter(i=>all||(r[i]||0)<10);if(!order.length){alert('全問10回正解済みです！');return}shuffle(order);pos=0;$('home').classList.add('hide');$('quiz').classList.remove('hide');next()}function next(){if(pos>=order.length){alert('今回の出題が終了しました');goHome();return}current=order[pos];let r=D[kind][current]||0;$('meta').textContent=`${pos+1}/${order.length}　この問題の正解 ${r}/10回`;$('prog').style.width=(pos/order.length*100)+'%';$('ans').classList.add('hide');$('judge').classList.add('hide');$('show').classList.remove('hide');if(kind==='h'){$('mapnum').classList.add('hide');$('q').textContent=H[current][0];$('ans').textContent=H[current][1]}else{$('mapnum').classList.remove('hide');$('mapnum').textContent=current+1;$('q').textContent=`地図の ${current+1} 番の国名は？`;$('ans').textContent=M[current]}}function showAnswer(){$('ans').classList.remove('hide');$('show').classList.add('hide');$('judge').classList.remove('hide')}function mark(ok){if(ok)D[kind][current]=(D[kind][current]||0)+1;localStorage.setItem('hmq',JSON.stringify(D));pos++;next()}function goHome(){$('quiz').classList.add('hide');$('home').classList.remove('hide');render()}function resetData(){if(confirm('この端末の正解回数をすべてリセットしますか？')){D={h:{},m:{}};localStorage.setItem('hmq',JSON.stringify(D));render()}}render();
</script></body></html>
