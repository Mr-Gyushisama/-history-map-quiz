<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>歴史・世界地図 1問1答</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0}h1{font-size:25px}.tabs{display:flex;gap:8px}.tabs button{flex:1}button{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:#e5e7eb}.primary{background:#111827;color:#fff;width:100%}.q{font-size:21px;font-weight:800;line-height:1.5;margin:18px 0}.hide{display:none!important}.muted{color:#6b7280}.inp{width:100%;font-size:20px;padding:16px;border:2px solid #cbd5e1;border-radius:12px;margin-bottom:12px}.ans{font-size:20px;font-weight:800;margin:14px 0}.map{position:relative;width:100%;height:340px;overflow:hidden;border:2px solid #cbd5e1;border-radius:14px;background:#dbeafe}.map svg{width:100%;height:100%;display:block}.maplabel{position:absolute;left:10px;top:10px;background:#111827e8;color:#fff;padding:7px 11px;border-radius:9px;font-weight:800;font-size:13px;z-index:5}.bar{height:9px;background:#e5e7eb;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#111827}</style></head><body><main><h1>歴史・世界地図 1問1答</h1><div id="home"><div class="card"><div class="tabs"><button id="bh" onclick="setKind('h')">歴史70問</button><button id="bm" onclick="setKind('m')">世界地図60問</button></div><p class="muted">答えを入力して採点。10回正解で通常出題から除外します。</p><div id="stats"></div></div><div class="card"><button class="primary" onclick="start(false)">ランダム学習開始</button></div></div><div id="quiz" class="card hide"><div class="bar"><i id="prog"></i></div><p id="meta" class="muted"></p><div id="map" class="map hide"><div class="maplabel">地図を読み込み中…</div><svg id="mapsvg" viewBox="0 0 1000 520" preserveAspectRatio="xMidYMid meet"><g id="mapg"></g></svg></div><div id="q" class="q"></div><input id="input" class="inp" placeholder="答えを入力" autocomplete="off"><button id="check" class="primary" onclick="check()">答え合わせ</button><div id="ans" class="ans hide"></div><button id="next" class="primary hide" onclick="advance()">次の問題へ</button><p><button onclick="location.reload()">終了して戻る</button></p></div></main><script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script><script src="app-v3.js?v=20260826-2"></script><script>
const ISO=['CHN','KOR','PRK','MNG','VNM','KHM','THA','MMR','MYS','SGP','IDN','PHL','IND','PAK','AFG','KAZ','IRN','IRQ','SAU','TUR','EGY','DZA','SOM','ETH','KEN','CMR','NGA','GHA','CIV','ZAF','GBR','IRL','NLD','DNK','DEU','FRA','ESP','PRT','ITA','GRC','ROU','AUT','POL','FIN','SWE','NOR','ISL','UKR','RUS','USA','CAN','MEX','CUB','ECU','BRA','PER','CHL','ARG','AUS','NZL'];
const NUM={'156':'CHN','410':'KOR','408':'PRK','496':'MNG','704':'VNM','116':'KHM','764':'THA','104':'MMR','458':'MYS','702':'SGP','360':'IDN','608':'PHL','356':'IND','586':'PAK','004':'AFG','398':'KAZ','364':'IRN','368':'IRQ','682':'SAU','792':'TUR','818':'EGY','012':'DZA','706':'SOM','231':'ETH','404':'KEN','120':'CMR','566':'NGA','288':'GHA','384':'CIV','710':'ZAF','826':'GBR','372':'IRL','528':'NLD','208':'DNK','276':'DEU','250':'FRA','724':'ESP','620':'PRT','380':'ITA','300':'GRC','642':'ROU','040':'AUT','616':'POL','246':'FIN','752':'SWE','578':'NOR','352':'ISL','804':'UKR','643':'RUS','840':'USA','124':'CAN','484':'MEX','192':'CUB','218':'ECU','076':'BRA','604':'PER','152':'CHL','032':'ARG','036':'AUS','554':'NZL'};
let geo=null;
function proj(pt){return[(pt[0]+180)/360*1000,(90-pt[1])/180*520]}
function rings(g){if(g.type==='Polygon')return g.coordinates;if(g.type==='MultiPolygon')return g.coordinates.flat();return[]}
function pathOf(f){let d='';rings(f.geometry).forEach(r=>{r.forEach((p,i)=>{const q=proj(p);d+=(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)});d+='Z'});return d}
function drawMap(){if(kind!=='m'||!geo)return;const iso=ISO[current],f=geo.features.find(x=>x.properties.ISO3===iso),g=document.getElementById('mapg'),svg=document.getElementById('mapsvg');if(!f){document.querySelector('.maplabel').textContent='対象国データなし';return}g.innerHTML='';let target=null;geo.features.forEach(x=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',pathOf(x));const hit=x.properties.ISO3===iso;p.setAttribute('fill',hit?'#ef4444':'#fff');p.setAttribute('stroke',hit?'#7f1d1d':'#94a3b8');p.setAttribute('stroke-width',hit?'3':'1');g.appendChild(p);if(hit)target=p});if(!target)return;const bb=target.getBBox();let pad=Math.max(bb.width,bb.height)*1.7;const tiny=['SGP','KOR','PRK','NLD','DNK','IRL'].includes(iso);if(tiny)pad=Math.max(bb.width,bb.height)*4;pad=Math.max(pad,45);svg.setAttribute('viewBox',(bb.x-pad)+' '+(bb.y-pad)+' '+(bb.width+pad*2)+' '+(bb.height+pad*2));document.querySelector('.maplabel').textContent='赤く塗られた国を答えよう'}
function loadGeo(){if(geo){drawMap();return}document.querySelector('.maplabel').textContent='地図を読み込み中…';fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(r=>{if(!r.ok)throw Error('map');return r.json()}).then(t=>{geo=topojson.feature(t,t.objects.countries);geo.features.forEach(f=>{f.properties=f.properties||{};f.properties.ISO3=NUM[String(f.id).padStart(3,'0')]||''});drawMap()}).catch(e=>{console.error(e);document.querySelector('.maplabel').textContent='地図読込エラー。画面を再読み込みしてください';});}
const baseShowQ=showQ;showQ=function(){baseShowQ();if(kind==='m'){document.getElementById('q').textContent='赤く塗られている国の名前を答えなさい。';loadGeo()}};
</script></body></html>
