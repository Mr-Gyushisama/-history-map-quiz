<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>歴史・世界地図 1問1答</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0}h1{font-size:25px}.tabs{display:flex;gap:8px}.tabs button{flex:1}button{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:#e5e7eb}.primary{background:#111827;color:#fff;width:100%}.q{font-size:21px;font-weight:800;line-height:1.5;margin:18px 0}.hide{display:none!important}.muted{color:#6b7280}.inp{width:100%;font-size:20px;padding:16px;border:2px solid #cbd5e1;border-radius:12px;margin-bottom:12px}.ans{font-size:20px;font-weight:800;margin:14px 0}.map{position:relative;width:100%;height:360px;overflow:hidden;border:2px solid #cbd5e1;border-radius:14px;background:#cfe8ff}.map svg{width:100%;height:100%;display:block}.maplabel{position:absolute;left:10px;top:10px;background:#111827e8;color:#fff;padding:7px 11px;border-radius:9px;font-weight:800;font-size:13px;z-index:5}.bar{height:9px;background:#e5e7eb;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#111827}#pin{display:none}.country{fill:#fff;stroke:#64748b;stroke-width:1.2;vector-effect:non-scaling-stroke}.target{fill:#ef4444;stroke:#991b1b;stroke-width:2.5;vector-effect:non-scaling-stroke}</style></head><body><main><h1>歴史・世界地図 1問1答</h1><div id="home"><div class="card"><div class="tabs"><button id="bh" onclick="setKind('h')">歴史70問</button><button id="bm" onclick="setKind('m')">世界地図60問</button></div><p class="muted">答えを入力して採点。10回正解で通常出題から除外します。</p><div id="stats"></div></div><div class="card"><button class="primary" onclick="start(false)">ランダム学習開始</button></div></div><div id="quiz" class="card hide"><div class="bar"><i id="prog"></i></div><p id="meta" class="muted"></p><div id="map" class="map hide"><div class="maplabel">赤く塗られた国を答えよう</div><div id="pin"></div><svg id="mapsvg" viewBox="0 0 1000 520" preserveAspectRatio="xMidYMid meet"><rect width="1000" height="520" fill="#cfe8ff"/><g id="countries"></g></svg></div><div id="q" class="q"></div><input id="input" class="inp" placeholder="答えを入力" autocomplete="off"><button id="check" class="primary" onclick="check()">答え合わせ</button><div id="ans" class="ans hide"></div><button id="next" class="primary hide" onclick="advance()">次の問題へ</button><p><button onclick="location.reload()">終了して戻る</button></p></div></main><script src="app-v3.js?v=20260826-8"></script><script>
let WORLD=null;
const ALIASES={'中華人民共和国':['China'],'大韓民国':['South Korea','Korea','Republic of Korea'],'朝鮮民主主義人民共和国':['North Korea','Dem. Rep. Korea'],'ロシア連邦':['Russia','Russian Federation'],'アメリカ合衆国':['United States of America','United States'],'コートジボワール':["Côte d'Ivoire",'Ivory Coast'],'南アフリカ共和国':['South Africa']};
function project(lon,lat){return[(lon+180)/360*1000,(90-lat)/180*520]}
function ringPath(r){return r.map((p,i)=>{const q=project(p[0],p[1]);return(i?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1)}).join(' ')+'Z'}
function geomPath(g){if(!g)return'';if(g.type==='Polygon')return g.coordinates.map(ringPath).join(' ');if(g.type==='MultiPolygon')return g.coordinates.map(p=>p.map(ringPath).join(' ')).join(' ');return''}
function namesOf(f){const p=f.properties||{};return[p.name,p.NAME,p.ADMIN,p.name_long,p.ADMIN0,p.sovereignt].filter(Boolean).map(String)}
function isTarget(f,name){const wants=[name].concat(ALIASES[name]||[]).map(x=>x.toLowerCase());return namesOf(f).some(x=>wants.includes(x.toLowerCase()))}
async function loadWorld(){if(WORLD)return WORLD;const urls=['https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson','https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json'];for(const u of urls){try{const r=await fetch(u,{cache:'force-cache'});if(r.ok){WORLD=await r.json();return WORLD}}catch(e){}}throw new Error('map load failed')}
function allPoints(g){const out=[];function walk(x){if(!Array.isArray(x))return;if(typeof x[0]==='number'&&typeof x[1]==='number')out.push(x);else x.forEach(walk)}walk(g.coordinates);return out}
function targetBounds(f){let pts=allPoints(f.geometry);if(!pts.length)return null;let lons=pts.map(p=>p[0]),lats=pts.map(p=>p[1]);let minLon=Math.min(...lons),maxLon=Math.max(...lons),minLat=Math.min(...lats),maxLat=Math.max(...lats);if(maxLon-minLon>180){lons=lons.map(x=>x<0?x+360:x);minLon=Math.min(...lons);maxLon=Math.max(...lons)}return{minLon,maxLon,minLat,maxLat,cLon:(minLon+maxLon)/2,cLat:(minLat+maxLat)/2}}
function regionView(b){let lonSpan=Math.max(28,(b.maxLon-b.minLon)*3.0),latSpan=Math.max(22,(b.maxLat-b.minLat)*3.2);if(lonSpan>115)lonSpan=115;if(latSpan>75)latSpan=75;let cLon=b.cLon;if(cLon>180)cLon-=360;let cLat=b.cLat;const x=(cLon+180)/360*1000,y=(90-cLat)/180*520,w=lonSpan/360*1000,h=latSpan/180*520;let vw=Math.max(w,h*1000/520),vh=Math.max(h,w*520/1000);vw=Math.min(vw,430);vh=Math.min(vh,300);return[x-vw/2,y-vh/2,vw,vh]}
async function drawCountryMap(){if(kind!=='m')return;const g=document.getElementById('countries'),label=document.querySelector('.maplabel'),svg=document.getElementById('mapsvg');label.textContent='地図を読み込み中…';g.innerHTML='';try{const data=await loadWorld(),name=M[current];let hit=null,html='';for(const f of data.features){const target=isTarget(f,name);if(target&&!hit)hit=f;html+='<path class="country '+(target?'target':'')+'" d="'+geomPath(f.geometry)+'"></path>'}g.innerHTML=html;if(hit){const b=targetBounds(hit),v=regionView(b);svg.setAttribute('viewBox',v.join(' '));label.textContent='赤く塗られた国を答えよう'}else{const lat=P[current][0],lon=P[current][1],x=(lon+180)/360*1000,y=(90-lat)/180*520;svg.setAttribute('viewBox',(x-140)+' '+(y-90)+' 280 180');label.textContent='赤い国を答えよう'}}catch(e){label.textContent='地図の読み込みに失敗しました'}}
const baseShowQ=showQ;showQ=function(){baseShowQ();if(kind==='m'){document.getElementById('q').textContent='赤く塗られている国の名前を答えなさい。';drawCountryMap()}};
</script></body></html>
