">球筋</div><div class="grid3">';var shapes=[['G','ゴロ','◡'],['F','フライ','◠'],['L','ライナー','―'],['H','強襲','襲'],['B','バント','打'],['BF','バント飛球','飛'],['FF','ファウル飛球','邪']];for(j=0;j<shapes.length;j++)o+='<button class="btn '+(q.shape===shapes[j][0]?'primary':'')+'" data-shape="'+shapes[j][0]+'">'+shapes[j][2]+' '+shapes[j][1]+'</button>';o+='</div><div class="muted" style="margin-top:12px">処理した野手</div><div class="grid3">';for(j=1;j<=9;j++)o+='<button class="btn '+(String(j)===q.fielder?'primary':'')+'" data-fielder="'+j+'">'+j+'</button>';o+='</div>';if(q.shape==='G'||q.shape==='B'){o+='<div class="muted" style="margin-top:12px">送球先（打者アウト時）</div><div class="grid3">';for(j=1;j<=9;j++)o+='<button class="btn '+(String(j)===q.target?'primary':'')+'" data-target="'+j+'">'+j+'</button>';o+='</div>'}o+='<div class="muted" style="margin-top:12px">結果</div><div class="grid3"><button class="btn primary" data-result="1B">単打</button><button class="btn" data-result="2B">二塁打</button><button class="btn" data-result="3B">三塁打</button><button class="btn primary" data-result="HR">本塁打</button><button class="btn" data-result="OUT">打者アウト</button><button class="btn" data-result="FC">野選</button><button class="btn" data-result="E">失策</button></div><div class="last"><b>表記プレビュー：'+makeNotation('OUT')+'</b></div><button class="btn full" data-act="close" style="margin-top:10px">閉じる</button></div></div>';return o}
function render(){var v=st.view==='setup'?setup():st.view==='live'?live():st.view==='box'?box():st.view==='data'?data():st.view==='history'?history():home();app.innerHTML='<div class="app">'+top()+v+(st.view==='setup'?'':bottom())+modal()+(st.toast?'<div class="toast">'+st.toast+'</div>':'')+'</div>'}
function btn(x){while(x&&x!==app){if(x.tagName&&x.tagName.toLowerCase()==='button')return x;x=x.parentNode}return null}
app.addEventListener('click',function(e){var t=btn(e.target),a;if(!t)return;if(t.getAttribute('data-nav'))return nav(t.getAttribute('data-nav'));if(t.getAttribute('data-side')){st.draft.side=t.getAttribute('data-side');save();return render()}if(t.getAttribute('data-pitch'))return pitch(t.getAttribute('data-pitch'));if(t.getAttribute('data-run-event'))return prepareRunnerEvent(t.getAttribute('data-run-event'));if(t.getAttribute('data-shape')){st.play.shape=t.getAttribute('data-shape');return render()}if(t.getAttribute('data-fielder')){st.play.fielder=t.getAttribute('data-fielder');return render()}if(t.getAttribute('data-target')){st.play.target=t.getAttribute('data-target');return render()}if(t.getAttribute('data-base')){snap();st.g.bases[t.getAttribute('data-base')]=st.g.bases[t.getAttribute('data-base')]?null:bat().id;save();return render()}if(t.getAttribute('data-result'))return beginInplay(t.getAttribute('data-result'));if(t.getAttribute('data-select-runner')!==null){selectRunnerAction(parseInt(t.getAttribute('data-select-runner'),10));return}if(t.getAttribute('data-rp-outbase')!==null){var roi=parseInt(t.getAttribute('data-rp-outbase'),10);st.runnerPlay.actions[roi].outAt=t.getAttribute('data-value');st.runnerPlay.actions[roi].outBy=defaultOutBy(t.getAttribute('data-value'));return render()}if(t.getAttribute('data-rp-outby')!==null){var rfi=parseInt(t.getAttribute('data-rp-outby'),10);st.runnerPlay.actions[rfi].outBy=t.getAttribute('data-value');return render()}if(t.getAttribute('data-rp-earned')!==null){var rei=parseInt(t.getAttribute('data-rp-earned'),10);st.runnerPlay.actions[rei].earned=t.getAttribute('data-value')==='1';return render()}if(t.getAttribute('data-runner')!==null){var ri=parseInt(t.getAttribute('data-runner'),10),to=t.getAttribute('data-to'),ra=st.play.runnerActions[ri];ra.to=to;ra.outcome=to==='out'?'out':'safe';if(to==='out'){ra.outAt=ra.outAt||nextBase(ra.from);ra.outBy=ra.outBy||defaultOutBy(ra.outAt)}return render()}if(t.getAttribute('data-outbase')!==null){var oi=parseInt(t.getAttribute('data-outbase'),10);st.play.runnerActions[oi].outAt=t.getAttribute('data-value');st.play.runnerActions[oi].outBy=defaultOutBy(t.getAttribute('data-value'));return render()}if(t.getAttribute('data-outby')!==null){var fi=parseInt(t.getAttribute('data-outby'),10);st.play.runnerActions[fi].outBy=t.getAttribute('data-value');return render()}if(t.getAttribute('data-earned')!==null){var ei=parseInt(t.getAttribute('data-earned'),10);st.play.runnerActions[ei].earned=t.getAttribute('data-value')==='1';return render()}if(t.getAttribute('data-rbi')!==null){var bi2=parseInt(t.getAttribute('data-rbi'),10);st.play.runnerActions[bi2].rbi=t.getAttribute('data-value')==='1';return render()}a=t.getAttribute('data-act');if(a==='new'){st.draft={date:today(),opponent:'',side:'away'};st.view='setup';render()}else if(a==='start'){st.g=game(st.draft);st.undo=[];st.redo=[];st.view='live';ev('system','試合開始');save();render()}else if(a==='inplay'){st.play={shape:'G',fielder:'',target:'3',result:'',runnerActions:[]};st.modal='inplay';render()}else if(a==='close'){st.modal='';render()}else if(a==='back-inplay'){st.modal='inplay';render()}else if(a==='commit-play'){commitInplay()}else if(a==='commit-runner-event'){commitRunnerEvent()}else if(a==='undo')undo();else if(a==='redo')redo();else if(a==='end'){snap();st.g.over=true;ev('system','試合終了');save();st.view='box';render()}});
app.addEventListener('input',function(e){if(e.target.id==='opp')st.draft.opponent=e.target.value;if(e.target.id==='date')st.draft.date=e.target.value;save()});
load();render();
})();
